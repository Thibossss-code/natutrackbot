<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NatuTrack</title>
<style>
body{font-family:Arial;background:#f0f7e6;margin:0;padding:10px}
.card{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:10px;padding:12px;font-weight:bold;width:100%;margin:5px 0;cursor:pointer}
.b47{background:#7bc67e}.b60{background:#2e7d32;color:#fff}
input{padding:12px;border-radius:10px;border:1px solid #ccc;width:90%}
a{display:block;padding:10px;background:#fff3e0;border-radius:8px;margin:6px 0;text-decoration:none;color:#e65100;font-weight:bold}
</style></head><body>
<h1 style="color:#2e7d32">🌿 NatuTrack</h1>

<div class="card"><b>📊 Tracker</b><br><br>
<input id="score" type="number" placeholder="1-10"><br>
<button class="b60" onclick="addTrack()">+ Add Today</button>
<div id="trackList"></div></div>

<div class="card"><b>⏰ Reminder</b><br>
<input id="remTime" type="time"><br>
<button class="b47" onclick="setRem()">Set Reminder</button>
<p id="remStatus"></p></div>

<div class="card" style="background:#e8f5e9"><b>🤖 Bot FIXED ✅</b><br>
<input id="botQ" placeholder="Type hello, rooibos, ginger..."><br>
<button class="b60" onclick="askBot()">Ask Bot</button>
<p id="botA" style="background:white;padding:10px;border-radius:8px;min-height:20px"></p></div>

<div class="card"><b>🔗 Amazon Tools ✅ thibossss-20</b><br>
<a href="https://www.amazon.com/s?k=rooibos+tea&tag=thibossss-20" target="_blank">🌿 Tool 1: Rooibos Tea</a>
<a href="https://www.amazon.com/s?k=ginger+tea+digestion&tag=thibossss-20" target="_blank">🌿 Tool 2: Ginger Tea</a>
<a href="https://www.amazon.com/s?k=turmeric+curcumin&tag=thibossss-20" target="_blank">🌿 Tool 3: Turmeric</a>
<a href="https://www.amazon.com/s?k=yoga+mat&tag=thibossss-20" target="_blank">🌿 Tool 4: Yoga Mat</a>
<a href="https://www.amazon.com/s?k=blender+bottle&tag=thibossss-20" target="_blank">🌿 Tool 5: Shaker Bottle</a>
<a href="https://www.amazon.com/s?k=digital+food+scale&tag=thibossss-20" target="_blank">🌿 Tool 6: Food Scale</a>
</div>

<div class="card" style="background:#dcedc8"><b>FREE Sample!</b><br><br>
<input id="freeEmail" placeholder="your email"><br>
<button class="b60" onclick="freeSample()">Send Free Sample</button>
<p id="freeMsg"></p></div>

<div id="plans"></div>

<script>
function addTrack(){let s=document.getElementById('score').value;if(!s)return;let l=JSON.parse(localStorage.getItem('tracks')||'[]');l.push(new Date().toLocaleDateString()+': '+s+'/10');localStorage.setItem('tracks',JSON.stringify(l));showTracks();document.getElementById('score').value='';}
function showTracks(){let l=JSON.parse(localStorage.getItem('tracks')||'[]');document.getElementById('trackList').innerHTML=l.map(x=>'✅ '+x).join('<br>');}showTracks();
function setRem(){let t=document.getElementById('remTime').value;if(!t)return;localStorage.setItem('remTime',t);document.getElementById('remStatus').innerText='✅ Reminder '+t;alert('Reminder '+t);}
function askBot(){
 let q=document.getElementById('botQ').value.toLowerCase().trim();
 let a='';
 if(!q)a='Type hello, rooibos, diabetes...';
 else if(q.includes('hello')||q.includes('hi')||q.includes('hey'))a='Hello! 👋 I am NatuTrack Bot! Try: rooibos, ginger, turmeric, diabetes, high bp, insomnia... How can I help?';
 else if(q.includes('rooibos'))a='🌿 Rooibos: No caffeine, antioxidant, great for Diabetes & BP. 2 cups/day.';
 else if(q.includes('ginger'))a='🫚 Ginger: For Digestion & nausea. 3 slices in hot water.';
 else if(q.includes('turmeric'))a='✨ Turmeric: For Arthritis, mix with black pepper.';
 else if(q.includes('diabetes'))a='🩸 Diabetes: Low GI, rooibos + cinnamon, oats. See plan below $47.';
 else if(q.includes('bp')||q.includes('pressure'))a='❤️ High BP: Less salt, hibiscus tea, garlic, walk 30min.';
 else if(q.includes('sleep')||q.includes('insomnia'))a='😴 Insomnia: Chamomile tea, no screen 1hr before bed.';
 else a='Thanks for "'+q+'"! Herbs: rooibos (BP), ginger (digestion), turmeric (joints). What is your condition?';
 document.getElementById('botA').innerText=a;
}
function freeSample(){let e=document.getElementById('freeEmail').value;if(!e.includes('@'))return;document.getElementById('freeMsg').innerText='✅ Sent to '+e;window.open('mailto:'+e+'?subject=FREE Sample&body=Day 1: Rooibos + Oats. Full: https://payhip.com/b/M0tfg','_blank');}
var ills=["Diabetes","High BP","Insomnia","Anxiety","Digestion","Arthritis","Cholesterol","Weight Loss","Stress","Immune"];
var out="";for(var i=0;i<ills.length;i++){out+='<div class="card"><b>'+ills[i]+' Meal Plan</b><p>Breakfast/Lunch/Supper + Herb + Tracker</p><button class="b47" onclick="buyBasic(\''+ills[i]+'\')">Basic $47 - 7 Day</button><button class="b60" onclick="buyPrem(\''+ills[i]+'\')">Premium $60 - 30 Day + Bot</button></div>';}
document.getElementById("plans").innerHTML=out;
function buyBasic(ill){window.open('https://payhip.com/b/M0tfg','_blank');}
function buyPrem(ill){window.open('https://payhip.com/b/M0tfg','_blank');}
</script>
</body></html>
