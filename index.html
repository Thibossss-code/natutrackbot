<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NatuTrack</title>
<style>
body{font-family:Arial;background:#f0f7e6;margin:0;padding:10px}
.card{background:white;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:10px;padding:12px;font-weight:bold;width:100%;margin:5px 0}
.b47{background:#7bc67e}.b60{background:#2e7d32;color:#fff}
input{padding:12px;border-radius:10px;border:1px solid #ccc;width:90%}
a{display:block;padding:10px;background:#fff3e0;border-radius:8px;margin:6px 0;text-decoration:none;color:#e65100;font-weight:bold}
</style></head><body>
<h1 style="color:#2e7d32">🌿 NatuTrack</h1>

<div class="card"><b>📊 Tracker</b><br><br>
<input id="score" type="number" placeholder="1-10 how you feel"><br>
<button class="b60" onclick="addTrack()">+ Add Today</button>
<div id="trackList"></div></div>

<div class="card"><b>⏰ Reminder</b><br>
<input id="remTime" type="time"><br>
<button class="b47" onclick="setRem()">Set Reminder</button>
<p id="remStatus"></p></div>

<div class="card" style="background:#e8f5e9"><b>🤖 Bot</b><br>
<input id="botQ" placeholder="ginger, rooibos, diabetes"><br>
<button class="b60" onclick="askBot()">Ask</button>
<p id="botA"></p></div>

<div class="card"><b>🔗 Amazon Tools ✅ WORKING - thibossss-20</b><br>
<a href="https://www.amazon.com/s?k=rooibos+tea&tag=thibossss-20" target="_blank">🌿 Tool 1: Rooibos Tea</a>
<a href="https://www.amazon.com/s?k=ginger+tea+digestion&tag=thibossss-20" target="_blank">🌿 Tool 2: Ginger Tea</a>
<a href="https://www.amazon.com/s?k=turmeric+curcumin&tag=thibossss-20" target="_blank">🌿 Tool 3: Turmeric</a>
<a href="https://www.amazon.com/s?k=yoga+mat&tag=thibossss-20" target="_blank">🌿 Tool 4: Yoga Mat</a>
<a href="https://www.amazon.com/s?k=blender+bottle&tag=thibossss-20" target="_blank">🌿 Tool 5: Shaker Bottle</a>
<a href="https://www.amazon.com/s?k=digital+food+scale&tag=thibossss-20" target="_blank">🌿 Tool 6: Food Scale</a>
</div>

<div class="card" style="background:#dcedc8"><b>FREE Sample!</b><br><br>
<input id="freeEmail" placeholder="your email"><br>
<button class="b60" onclick="freeSample()">Send Free Sample</button>
<p id="freeMsg"></p></div>

<div id="plans"></div>

<script>
function addTrack(){let s=document.getElementById('score').value;if(!s)return;let list=JSON.parse(localStorage.getItem('tracks')||'[]');list.push(new Date().toLocaleDateString()+': '+s+'/10');localStorage.setItem('tracks',JSON.stringify(list));showTracks();document.getElementById('score').value='';}
function showTracks(){let list=JSON.parse(localStorage.getItem('tracks')||'[]');document.getElementById('trackList').innerHTML=list.map(x=>'✅ '+x).join('<br>');}showTracks();
function setRem(){let t=document.getElementById('remTime').value;if(!t)return;localStorage.setItem('remTime',t);document.getElementById('remStatus').innerText='✅ Reminder '+t;}
function askBot(){let q=document.getElementById('botQ').value.toLowerCase();let a='Rooibos good for diabetes & BP, Ginger for digestion, Turmeric for arthritis.';if(q.includes('rooibos'))a='Rooibos: no caffeine, antioxidant, 2 cups/day for sugar & BP.';if(q.includes('ginger'))a='Ginger: boil 3 slices, helps digestion & nausea.';document.getElementById('botA').innerText=a;}
function freeSample(){let e=document.getElementById('freeEmail').value;if(!e.includes('@'))return;document.getElementById('freeMsg').innerText='✅ Sent to '+e;window.open('mailto:'+e+'?subject=FREE NatuTrack Sample','_blank');}
var ills=["Diabetes","High BP","Insomnia","Anxiety","Digestion","Arthritis","Cholesterol","Weight Loss","Stress","Immune"];
var out="";for(var i=0;i<ills.length;i++){out+='<div class="card"><b>'+ills[i]+' Meal Plan</b><p style="font-size:12px">Breakfast/Lunch/Supper + Herb + Tracker</p><button class="b47" onclick="buyBasic(\''+ills[i]+'\')">Basic $47 - 7 Day</button><button class="b60" onclick="buyPrem(\''+ills[i]+'\')">Premium $60 - 30 Day + Bot</button></div>';}
document.getElementById("plans").innerHTML=out;
function buyBasic(ill){window.open('mailto:natutracthabopeter@gmail.com?subject=Buy Basic '+ill+' $47 - Send Payment Link&body=I want '+ill+' Basic $47','_blank');alert('Email opened! You will receive payment link for Basic '+ill+' $47');}
function buyPrem(ill){window.open('mailto:natutracthabopeter@gmail.com?subject=Buy Premium '+ill+' $60&body=I want '+ill+' Premium $60','_blank');alert('Email opened! You will receive payment link for Premium '+ill+' $60');}
</script>
</body></html>
